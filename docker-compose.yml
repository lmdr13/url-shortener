services:
  db:
    image: postgres:15-alpine
    container_name: url-db
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: db
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: url-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "dbname=db user=myuser password=mypassword host=db port=5432"
    depends_on:
      - db



volumes:
  pgdata: